<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SirTootalot | Welcome</title>
    <style>
        :root {
            --primary: #d4af37; /* Royal Gold Accent */
            --dark: #121620;    /* Sleek Deep Slate Background */
            --card-bg: #1c2130; /* Slightly lighter container */
            --text-main: #f4f5f7;
            --text-muted: #a0aec0;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .card {
            max-width: 500px;
            margin: 20px;
            padding: 40px;
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(212, 175, 55, 0.2);
        }
        h1 {
            font-size: 2.5rem;
            margin: 0 0 15px 0;
            color: var(--primary);
            font-family: 'Georgia', serif;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background-color: var(--primary);
            color: var(--dark);
            padding: 14px 32px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            background-color: #f3e5ab;
        }
        footer {
            margin-top: 40px;
            font-size: 0.85rem;
            color: #4a5568;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Sir Tootalot</h1>
        <p>test branch Welcome to the official home of Sir Tootalot. Something incredible is currently brewing inside our digital castle. Stay tuned for major announcements, grand adventures, and noble updates!</p>
        <a href="#" class="btn">Sound the Horn</a>
    </div>

    <footer>
        &copy; 2026 Sir Tootalot. All rights reserved.
    </footer>

</body>
</html>
